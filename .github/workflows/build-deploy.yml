name: Build, Pages & Release

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Build
        run: npm run build

      - name: Netlify-ZIP
        id: zip
        run: echo "file=$(node scripts/zip.mjs)" >> "$GITHUB_OUTPUT"

      - name: ZIP als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: netlify-zip
          path: release/*.zip

      # GitHub Pages: dist/ wird auf den Branch gh-pages gelegt (Pages-Quelle: gh-pages / root)
      - name: Auf GitHub Pages veröffentlichen
        if: github.ref_type == 'branch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # Release mit ZIP bei jedem Versions-Tag
      - name: GitHub-Release erstellen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v t="## ${TAG}" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version ${TAG}" > notes.md
          gh release create "$TAG" "${{ steps.zip.outputs.file }}" --title "$TAG" --notes-file notes.md
