name: Build, Pages & Release

# Läuft bei jedem Push und per Knopf ("Run workflow") — auch vom iPad aus.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) API testen und — sobald Cloudflare eingerichtet ist — komplett selbst einrichten und deployen
  api:
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Abhängigkeiten (API)
        run: npm ci --prefix api

      - name: Typprüfung und Integrationstests (API)
        run: npm --prefix api run check && npm --prefix api test

      - name: Cloudflare einrichten, Migrationen anwenden, Worker deployen
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WALLET_TRANSFER_RPC: ${{ vars.WALLET_TRANSFER_RPC }}
          WALLET_RECIPIENT: ${{ vars.WALLET_RECIPIENT }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          NETLIFY_ON: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
          NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME || 'mais-tower-defense-maiskolbistan' }}
        run: |
          if [ "$NETLIFY_ON" = "true" ]; then export EXTRA_ORIGIN="https://${NETLIFY_SITE_NAME}.netlify.app"; fi
          api/scripts/ci-deploy.sh

  # 2) Spiel bauen -> GitHub Pages, Netlify-ZIP, Release
  build:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: Build
        env:
          # API-Adresse: Repo-Variable API_URL (falls gesetzt), sonst automatisch aus dem API-Deploy. Leer = ohne Anmeldung.
          VITE_API_URL: ${{ vars.API_URL || needs.api.outputs.api_url }}
        run: |
          echo "API-Adresse im Build: ${VITE_API_URL:-(keine, Spiel ohne Anmeldung)}"
          npm run build

      - name: Netlify-ZIP
        id: zip
        run: echo "file=$(node scripts/zip.mjs)" >> "$GITHUB_OUTPUT"

      - name: ZIP als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: netlify-zip
          path: release/*.zip

      # GitHub Pages: dist/ wird auf den Branch gh-pages gelegt (Pages-Quelle: gh-pages / root)
      - name: Auf GitHub Pages veröffentlichen
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # Optional: Netlify automatisch befüllen (Secret NETLIFY_AUTH_TOKEN)
      - name: Auf Netlify veröffentlichen (falls eingerichtet)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_NAME: ${{ vars.NETLIFY_SITE_NAME || 'mais-tower-defense-maiskolbistan' }}
        run: scripts/netlify-deploy.sh "${{ steps.zip.outputs.file }}"

      # Release mit ZIP, sobald package.json eine neue Version hat (Tag wird automatisch erzeugt)
      - name: GitHub-Release erstellen (falls Version neu)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.zip.outputs.file }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert bereits"
            exit 0
          fi
          awk -v t="## ${TAG}" '$0==t{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version ${TAG}" > notes.md
          gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
